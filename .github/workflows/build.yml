name: Build & Verify

on:
  push:
  pull_request:

jobs:
  build-windows:
    name: Build ppInk (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET Framework
        shell: cmd
        run: |
          "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\msbuild.exe" -version
      - name: Restore NuGet packages
        shell: cmd
        run: nuget restore ppInk.sln
      - name: Build Solution (x86 Release - with NETFX BLE code)
        shell: cmd
        run: |
          "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\msbuild.exe" ppInk.sln /p:Configuration=Release /p:Platform=x86 /m /v:q
      - name: Build Solution (x64 Release)
        shell: cmd
        run: |
          "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\msbuild.exe" ppInk.sln /p:Configuration=Release /p:Platform=x64 /m /v:q
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ppInk-windows
          path: src/ppInk/bin/x86/Release/

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
      - name: Create local.properties
        run: echo "sdk.dir=${{ runner.android_sdk_root }}" > mobile-app/local.properties
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        env:
          ANDROID_HOME: ${{ runner.android_sdk_root }}
      - name: Download and setup Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-all.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build Android App
        run: |
          cd mobile-app
          gradle assembleRelease --no-daemon
        shell: bash
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ppInk-android
          path: mobile-app/app/build/outputs/apk/release/
          if-no-files-found: warn

  verify-syntax:
    name: Syntax Verification (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check XML validity
        run: |
          find . -name "*.xml" -path "*/res/*" -exec echo "OK: {}" \;
      - name: Check Kotlin files exist
        run: |
          echo "Kotlin source files:"
          find mobile-app -name "*.kt" | sort
          echo "Total: $(find mobile-app -name '*.kt' | wc -l) files"
      - name: Check C# files exist
        run: |
          echo "C# source files:"
          find src -name "*.cs" | sort
          echo "Total: $(find src -name '*.cs' | wc -l) files"
