name: Build & Verify

on:
  push:
  pull_request:

jobs:
  build-windows:
    name: Build ppInk (C#)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Write build timestamp
        shell: pwsh
        run: |
          $ts = (Get-Date -Format 'dd/MM/yyyy HH:mm:ss')
          Write-Host "Build timestamp: $ts"
          "namespace gInk { public static class Build { public static string Timestamp = `"$ts`".Substring(0,16);}}" | Out-File -Encoding UTF8 src/BuildTimestamp.cs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: cmd
        run: nuget restore src\ppInk.csproj -PackagesDirectory "src\packages"

      - name: Build Solution (x86 Release)
        shell: pwsh
        run: |
          # Detect installed Windows SDK version (prefer 10.0.22621.0 for .NET 4.8 compat)
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = "10.0.22621.0"
          if (Test-Path $sdkPath) {
            $versions = Get-ChildItem $sdkPath | Where-Object { $_.Name -match '^10\.0\.\d+' } | Sort-Object Name -Descending
            if ($versions.Count -gt 0) {
              $preferred = $versions | Where-Object { $_.Name -eq "10.0.22621.0" }
              $sdkVer = if ($preferred) { "10.0.22621.0" } else { $versions[0].Name }
            }
          }
          Write-Host "Using Windows SDK version: $sdkVer"
          Write-Host "Building x86 Release..."
          msbuild src\ppInk.csproj /p:Configuration=Release /p:Platform=x86 /p:TargetPlatformVersion="$sdkVer" /p:PostBuildEvent= /m /v:d

      - name: Build Solution (x64 Release)
        shell: pwsh
        run: |
          # Detect installed Windows SDK version (prefer 10.0.22621.0 for .NET 4.8 compat)
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = "10.0.22621.0"
          if (Test-Path $sdkPath) {
            $versions = Get-ChildItem $sdkPath | Where-Object { $_.Name -match '^10\.0\.\d+' } | Sort-Object Name -Descending
            if ($versions.Count -gt 0) {
              $preferred = $versions | Where-Object { $_.Name -eq "10.0.22621.0" }
              $sdkVer = if ($preferred) { "10.0.22621.0" } else { $versions[0].Name }
            }
          }
          Write-Host "Using Windows SDK version: $sdkVer"
          Write-Host "Building x64 Release..."
          msbuild src\ppInk.csproj /p:Configuration=Release /p:Platform=x64 /p:TargetPlatformVersion="$sdkVer" /p:PostBuildEvent= /m /v:d

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ppInk-windows
          path: |
            src/ppInk/bin/x86/Release/
            src/ppInk/bin/x64/Release/

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > mobile-app/local.properties

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          mkdir -p "$ANDROID_HOME/licenses"
          cp -r ~/.android/licenses/* "$ANDROID_HOME/licenses/" 2>/dev/null || true

      - name: Download and setup Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-all.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Android App
        shell: bash
        run: |
          cd mobile-app
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ppInk-android
          path: mobile-app/app/build/outputs/apk/release/
          if-no-files-found: warn

  verify-syntax:
    name: Syntax Verification (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check XML validity
        run: |
          find . -name "*.xml" -path "*/res/*" -exec echo "OK: {}" \;

      - name: Check Kotlin files exist
        run: |
          echo "Kotlin source files:"
          find mobile-app -name "*.kt" | sort
          echo "Total: $(find mobile-app -name '*.kt' | wc -l) files"

      - name: Check C# files exist
        run: |
          echo "C# source files:"
          find src -name "*.cs" | sort
          echo "Total: $(find src -name '*.cs' | wc -l) files"

      - name: Check for empty catch blocks (quality gate)
        run: |
          EMPTY_CATCHES=$(grep -rn 'catch\s*{' src/ --include="*.cs" | grep -v '// ' | wc -l)
          echo "Empty catch blocks found: $EMPTY_CATCHES"
          if [ "$EMPTY_CATCHES" -gt 0 ]; then
            echo "::warning file=build::$EMPTY_CATCHES empty catch blocks detected - prefer Contains() or log exception"
          fi

      - name: Check for public single-letter or Form1 fields
        run: |
          BAD_NAMES=$(grep -rn 'public partial class Form1' src/ --include="*.cs" | grep -v "FormOptions\|FormDisplay\|FormCollection\|FormInput\|FormAbout\|FormButtonHitter\|FormQrDisplay\|ColorPickerDlg\|PenModifyDlg\|ArrowSelDlg" | wc -l)
          if [ "$BAD_NAMES" -gt 0 ]; then echo "::error::Found Form1 class name"; exit 1; fi
