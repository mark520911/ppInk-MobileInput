name: Build & Verify

on:
  push:
  pull_request:

jobs:
  build-windows:
    name: Build ppInk (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 配置 Visual Studio 最新的 MSBuild 工具链
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ppInk.sln

      # 编译 x86 版本：传入 TargetPlatformVersion 以保障 WinRT API (BLE/Gatt) 的编译支持
      - name: Build Solution (x86 Release)
        run: |
          msbuild ppInk.sln /p:Configuration=Release /p:Platform="x86" /p:TargetPlatformVersion=10.0.19041.0 /m /v:m

      # 编译 x64 版本
      - name: Build Solution (x64 Release)
        run: |
          msbuild ppInk.sln /p:Configuration=Release /p:Platform="x64" /p:TargetPlatformVersion=10.0.19041.0 /m /v:m

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppInk-windows
          path: |
            src/ppInk/bin/x86/Release/
            src/ppInk/bin/x64/Release/

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      # 使用官方 setup-gradle 自动配置 Gradle 依赖与环境
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > mobile-app/local.properties

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Android App
        shell: bash
        run: |
          cd mobile-app
          # 优先尝试使用系统的 gradle 编译，避免 gradlew 下载过程丢失可执行文件
          if gradle assembleRelease --no-daemon --stacktrace; then
            echo "System gradle build succeeded."
          else
            echo "Fallback to gradlew..."
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppInk-android
          path: mobile-app/app/build/outputs/apk/release/
          if-no-files-found: warn

  verify-syntax:
    name: Syntax Verification (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check XML validity
        run: |
          find . -name "*.xml" -path "*/res/*" -exec echo "OK: {}" \;

      - name: Check Kotlin files exist
        run: |
          echo "Kotlin source files:"
          find mobile-app -name "*.kt" | sort
          echo "Total: $(find mobile-app -name '*.kt' | wc -l) files"

      - name: Check C# files exist
        run: |
          echo "C# source files:"
          find src -name "*.cs" | sort
          echo "Total: $(find src -name '*.cs' | wc -l) files"
