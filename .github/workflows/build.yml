name: Build & Verify

on:
  push:
  pull_request:

jobs:
  build-windows:
    name: Build ppInk (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # 显式 Restore 确保 WinRT 依赖包（如 Microsoft.Windows.SDK.Contracts）下载完整
      - name: Restore NuGet packages
        run: nuget restore ppInk.sln -MSBuildVersion 17

      # 优先尝试同时生成，指定 TargetFramework/TargetPlatformVersion
      - name: Build Solution (x86 Release)
        run: |
          msbuild ppInk.sln /p:Configuration=Release /p:Platform="x86" /m /v:m

      - name: Build Solution (x64 Release)
        run: |
          msbuild ppInk.sln /p:Configuration=Release /p:Platform="x64" /m /v:m

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppInk-windows
          path: |
            src/ppInk/bin/x86/Release/
            src/ppInk/bin/x64/Release/

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile-app/local.properties

      - name: Accept Android SDK Licenses
        run: |
          # 动态获取 ANDROID_HOME，防止变量为空落在根路径
          TARGET_SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$TARGET_SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$TARGET_SDK_DIR/tools/bin/sdkmanager"
          fi

          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          
          mkdir -p "$TARGET_SDK_DIR/licenses"
          cp -r ~/.android/licenses/* "$TARGET_SDK_DIR/licenses/" 2>/dev/null || true

      - name: Build Android App
        shell: bash
        run: |
          cd mobile-app
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppInk-android
          path: mobile-app/app/build/outputs/apk/release/
          if-no-files-found: warn

  verify-syntax:
    name: Syntax Verification (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check XML validity
        run: |
          find . -name "*.xml" -path "*/res/*" -exec echo "OK: {}" \;

      - name: Check Kotlin files exist
        run: |
          echo "Kotlin source files:"
          find mobile-app -name "*.kt" | sort
          echo "Total: $(find mobile-app -name '*.kt' | wc -l) files"

      - name: Check C# files exist
        run: |
          echo "C# source files:"
          find src -name "*.cs" | sort
          echo "Total: $(find src -name '*.cs' | wc -l) files"
